name: CI

on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: miaomiao_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d miaomiao_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/miaomiao_test?schema=public
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-session-secret-012345678901234567890123
      PHONE_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run data:reconcile
      - run: npm audit --omit=dev --audit-level=high
      - run: docker compose config
      - run: |
          docker compose config | grep -q 'HOSTNAME: 0.0.0.0'
          docker compose config | grep -q 'http://127.0.0.1:3000/api/health'
      - uses: docker/setup-buildx-action@v3
      - name: Build app image (target runner) with registry cache
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          load: true
          tags: miaomiao-points-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build worker image with registry cache
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: false
          load: true
          tags: miaomiao-points-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm --entrypoint sh miaomiao-points-worker:ci -c "test -f scripts/seed-admin.ts && test -f scripts/reconcile-data.ts && test -f scripts/ops-daily-check.ts && test -f scripts/upload-oss-backup.ts && test -f scripts/download-oss-backup.ts"
      - run: bash scripts/test-pull-release-images.sh

  e2e:
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --user 1001
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: miaomiao_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d miaomiao_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/miaomiao_test?schema=public
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ci-session-secret-012345678901234567890123
      PHONE_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      RUN_DB_TESTS: "1"
      PLAYWRIGHT_PROD_SERVER: "1"
      # e2e 走 http://127.0.0.1，生产构建默认 Secure Cookie 会被 WebKit 丢弃。
      SESSION_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_EVIDENCE_DIR: ${{ runner.temp }}
      - name: Upload Playwright screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-screenshots
          path: |
            output/playwright/*.png
            ${{ runner.temp }}/miaomiao-gift-catalog/
          if-no-files-found: error
          retention-days: 14

  staging:
    needs: [core, e2e]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    env:
      POSTGRES_DB: miaomiao_staging
      POSTGRES_USER: staging_admin
      DOCKER_REDIS_URL: redis://redis:6379
      REDIS_URL: redis://127.0.0.1:6379
      ADMIN_KUAISHOU_IDS: staging-health-admin
      ADMIN_NICKNAME: Staging Health Admin
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_SKIP_WEBSERVER: "1"
      SESSION_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Prepare isolated staging credentials and immutable metadata
        run: |
          database_password="$(openssl rand -hex 24)"
          admin_password="Staging-$(openssl rand -hex 16)"
          {
            echo "APP_BUILD_TIME=$(date -u --iso-8601=seconds)"
            echo "POSTGRES_PASSWORD=$database_password"
            echo "DOCKER_DATABASE_URL=postgresql://staging_admin:$database_password@postgres:5432/miaomiao_staging?schema=public"
            echo "DATABASE_URL=postgresql://staging_admin:$database_password@127.0.0.1:5433/miaomiao_staging?schema=public"
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
            echo "PHONE_ENCRYPTION_KEY=$(openssl rand -hex 32)"
            echo "ADMIN_PASSWORD=$admin_password"
          } >> "$GITHUB_ENV"
      - name: Build staging App image
        run: >-
          docker build --target runner
          --build-arg APP_COMMIT_SHA="$GITHUB_SHA"
          --build-arg APP_BUILD_TIME="$APP_BUILD_TIME"
          -t miaomiao-points-app:production .
      - name: Build staging Worker image
        run: >-
          docker build --target worker
          --build-arg APP_COMMIT_SHA="$GITHUB_SHA"
          --build-arg APP_BUILD_TIME="$APP_BUILD_TIME"
          -t miaomiao-points-worker:production .
      - name: Start isolated staging dependencies
        run: docker compose up -d postgres redis
      - name: Apply staging migrations
        run: docker compose run --rm migrate
      - name: Seed staging administrator
        run: docker compose run --rm --no-deps -e ADMIN_KUAISHOU_IDS -e ADMIN_PASSWORD -e ADMIN_NICKNAME worker npm run seed:admin
      - name: Start staging App and Worker
        run: docker compose up -d --no-build app worker
      - name: Verify staging health and immutable versions
        run: |
          for _ in {1..18}; do
            if health_json="$(curl --fail --silent --show-error http://127.0.0.1:3000/api/health)"; then
              printf '%s\n' "$health_json"
              if jq -e --arg sha "$GITHUB_SHA" '
                .ok == true
                and .database == "ok"
                and .redis == "ok"
                and .worker == "ok"
                and .app.commit == $sha
                and .workerVersion.commit == $sha
              ' <<<"$health_json" >/dev/null; then
                exit 0
              fi
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color app worker migrate
          exit 1
      - run: npm ci
      - name: Install Chromium for staging acceptance
        run: npx playwright install --with-deps chromium
      - name: Run admin staging acceptance at 390x844 and 1440x900
        env:
          PLAYWRIGHT_EVIDENCE_DIR: ${{ runner.temp }}
        run: >-
          npx playwright test
          tests/e2e/admin-responsive.spec.ts
          tests/e2e/birthday-system.spec.ts
          tests/e2e/gift-catalog.spec.ts
          --project=admin-desktop
          --project=admin-mobile
          --project=birthday-desktop
          --project=birthday-mobile
          --project=catalog-desktop
          --project=catalog-mobile
      - name: Collect staging container evidence
        if: always()
        run: |
          mkdir -p output/playwright
          docker compose ps > output/playwright/staging-containers.txt
          docker compose logs --no-color app worker migrate > output/playwright/staging-containers.log 2>&1
      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-acceptance
          path: |
            output/playwright/
            ${{ runner.temp }}/miaomiao-gift-catalog/
          if-no-files-found: error
          retention-days: 14
      - name: Tear down isolated staging
        if: always()
        run: docker compose down -v --remove-orphans
