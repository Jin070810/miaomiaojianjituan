name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: "已审查并合并到 main 的完整 commit SHA"
        required: true
        type: string
      candidate_run_id:
        description: "该 release SHA 在 main push 后成功生成候选镜像的 CI run ID"
        required: true
        type: string
      bootstrap_admin:
        description: "首次上线或明确重置管理员密码时勾选"
        required: true
        default: false
        type: boolean
      confirm_production:
        description: "我已确认 release SHA、备份、证书和回滚点，可以发布到正式环境"
        required: true
        default: false
        type: boolean
      solo_maintainer_confirmation:
        description: "单人维护者已完成 PR 自审、staging 验收和回滚确认（多人协作时也可作为发布负责人确认）"
        required: true
        default: false
        type: boolean
      confirm_alert_deferred:
        description: "仅在告警稍后配置且周挑战保持关闭时勾选；部署会强制验证开关关闭"
        required: true
        default: false
        type: boolean
      recover_from_failed_release:
        description: "确认当前线上是已知失败发布，允许跳过切换前健康门禁"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    steps:
      - name: Require explicit production confirmation
        env:
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
        run: |
          test "$CONFIRM_PRODUCTION" = "true"

      - name: Require maintainer review and staging confirmation
        env:
          SOLO_MAINTAINER_CONFIRMATION: ${{ inputs.solo_maintainer_confirmation }}
        run: |
          test "$SOLO_MAINTAINER_CONFIRMATION" = "true"

      - name: Validate release commit
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          if [[ ! "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_commit 必须是完整的 40 位 SHA"
            exit 1
          fi

      - name: Verify commit is merged into main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify release ancestry
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          git fetch --no-tags origin main
          git cat-file -e "$RELEASE_COMMIT^{commit}"
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main; then
            echo "release_commit 不是 origin/main 的祖先，拒绝部署未合并版本"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify the exact successful main CI run
        id: candidate_run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          mkdir -p output/release
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > output/release/run.json
          node scripts/release-manifest.mjs verify-run output/release/run.json "$RELEASE_COMMIT" "$CANDIDATE_RUN_ID"

      - name: Download only that validated attempt's release manifest
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          name: release-candidate-${{ inputs.candidate_run_id }}-${{ steps.candidate_run.outputs.attempt }}
          path: output/release/candidate

      - name: Read the merged release schema and migrations
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_commit }}
          path: release-source
          persist-credentials: false

      - name: Validate manifest, image digests, and migration checksums
        id: release
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          node scripts/release-manifest.mjs verify output/release/candidate/release-candidate.json \
            output/release/run.json "$RELEASE_COMMIT" "$CANDIDATE_RUN_ID" release-source
          cp output/release/candidate/release-candidate.json output/release/deploy-candidate.json

      - name: Verify current production health before switching
        env:
          PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
        run: |
          test -n "$PRODUCTION_DOMAIN"
          for _ in {1..3}; do
            if health_json="$(curl --fail --silent --show-error \
              --connect-timeout 5 --max-time 15 \
              "https://$PRODUCTION_DOMAIN/api/health")"; then
              printf '%s\n' "$health_json"
              if jq -e '
                .ok == true
                and .database == "ok"
                and .redis == "ok"
                and .worker == "ok"
                and .workerVersion.status == "ok"
                and .app.commit == .workerVersion.commit
              ' <<<"$health_json" >/dev/null; then
                exit 0
              fi
            fi
            sleep 10
          done
          if [[ "${{ inputs.recover_from_failed_release }}" == "true" ]]; then
            echo "::warning::当前生产环境健康检查失败；已明确确认这是已知失败发布，本次继续执行恢复切换"
          else
            echo "当前生产环境未通过切换前健康检查，拒绝发布" >&2
            exit 1
          fi

      - name: Configure SSH
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PATH: ${{ vars.PRODUCTION_PATH }}
        run: |
          test -n "$PRODUCTION_HOST"
          test -n "$PRODUCTION_USER"
          test -n "$PRODUCTION_PATH"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H "$PRODUCTION_HOST" >> "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<'EOF'
          Host *
            ServerAliveInterval 30
            ServerAliveCountMax 20
            TCPKeepAlive yes
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Inject DeepSeek, alert, and backup configuration
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PATH: ${{ vars.PRODUCTION_PATH }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_SMTP_HOST: ${{ vars.ALERT_SMTP_HOST }}
          ALERT_SMTP_PORT: ${{ vars.ALERT_SMTP_PORT }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
          ALERT_SMTP_SECURE: ${{ vars.ALERT_SMTP_SECURE }}
          ALERTS_DEFERRED: ${{ inputs.confirm_alert_deferred }}
          BACKUP_STORAGE_MODE: ${{ vars.BACKUP_STORAGE_MODE }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
          OSS_ECS_ROLE_NAME: ${{ vars.OSS_ECS_ROLE_NAME }}
          OSS_PREFIX: ${{ vars.OSS_PREFIX }}
          LOCAL_BACKUP_RETENTION_DAYS: ${{ vars.LOCAL_BACKUP_RETENTION_DAYS }}
        run: |
          [[ "$DEEPSEEK_BASE_URL" == https://* ]]
          test -n "$DEEPSEEK_API_KEY"
          test -n "$DEEPSEEK_MODEL"
          webhook_configured=false
          email_configured=false
          if [[ -n "$ALERT_WEBHOOK_URL" ]]; then
            [[ "$ALERT_WEBHOOK_URL" == https://* ]]
            webhook_configured=true
          fi
          if [[ -n "$ALERT_EMAIL_TO" || -n "$ALERT_SMTP_HOST" || -n "$ALERT_SMTP_USER" || -n "$ALERT_SMTP_PASSWORD" ]]; then
            if [[ -n "$ALERT_EMAIL_TO" && -n "$ALERT_SMTP_HOST" && -n "$ALERT_SMTP_USER" && -n "$ALERT_SMTP_PASSWORD" ]]; then
              [[ -z "$ALERT_SMTP_PORT" || "$ALERT_SMTP_PORT" =~ ^[0-9]+$ ]]
              if [[ -n "$ALERT_SMTP_PORT" ]]; then
                (( ALERT_SMTP_PORT >= 1 && ALERT_SMTP_PORT <= 65535 ))
              fi
              [[ -z "$ALERT_SMTP_SECURE" || "$ALERT_SMTP_SECURE" == "true" || "$ALERT_SMTP_SECURE" == "false" ]]
              email_configured=true
            elif [[ "$ALERTS_DEFERRED" != "true" ]]; then
              echo "SMTP 邮件告警配置不完整" >&2
              exit 1
            fi
          fi
          if [[ "$webhook_configured" != "true" && "$email_configured" != "true" ]]; then
            [[ "$ALERTS_DEFERRED" == "true" ]]
            echo "::warning::告警通道已明确延期，本次部署必须保持周挑战关闭"
          fi
          backup_storage_mode="${BACKUP_STORAGE_MODE:-local}"
          [[ "$backup_storage_mode" == "local" || "$backup_storage_mode" == "oss" ]]
          [[ "${LOCAL_BACKUP_RETENTION_DAYS:-7}" =~ ^[0-9]+$ ]]
          (( ${LOCAL_BACKUP_RETENTION_DAYS:-7} >= 1 && ${LOCAL_BACKUP_RETENTION_DAYS:-7} <= 90 ))
          if [[ "$backup_storage_mode" == "oss" ]]; then
            [[ "$OSS_BUCKET" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]]
            [[ "$OSS_ENDPOINT" =~ ^https://[^/]+\.aliyuncs\.com/?$ ]]
            [[ "$OSS_ECS_ROLE_NAME" =~ ^[A-Za-z0-9_-]{1,64}$ ]]
            [[ "${OSS_PREFIX:-miaomiao/production}" =~ ^[A-Za-z0-9/_-]{1,240}$ ]]
          fi
          # shellcheck disable=SC2029
          {
            cat <<'REMOTE_SCRIPT'
          set -euo pipefail
          env_file="$1"
          [[ -f "$env_file" ]]
          upsert_env() {
            local key="$1"
            local value="$2"
            if [[ "$value" == *$'\n'* || "$value" == *"'"* ]]; then
              echo "$key 包含环境文件不支持的字符" >&2
              exit 1
            fi
            local temp
            temp="$(mktemp)"
            grep -v "^${key}=" "$env_file" > "$temp" || true
            printf "%s='%s'\n" "$key" "$value" >> "$temp"
            chmod 600 "$temp"
            mv "$temp" "$env_file"
          }
          REMOTE_SCRIPT
            printf 'upsert_env DEEPSEEK_BASE_URL %q\n' "$DEEPSEEK_BASE_URL"
            printf 'upsert_env DEEPSEEK_API_KEY %q\n' "$DEEPSEEK_API_KEY"
            printf 'upsert_env DEEPSEEK_MODEL %q\n' "$DEEPSEEK_MODEL"
            printf 'upsert_env ALERT_WEBHOOK_URL %q\n' "$ALERT_WEBHOOK_URL"
            printf 'upsert_env ALERT_EMAIL_TO %q\n' "$ALERT_EMAIL_TO"
            printf 'upsert_env ALERT_EMAIL_FROM %q\n' "$ALERT_EMAIL_FROM"
            printf 'upsert_env ALERT_SMTP_HOST %q\n' "$ALERT_SMTP_HOST"
            printf 'upsert_env ALERT_SMTP_PORT %q\n' "$ALERT_SMTP_PORT"
            printf 'upsert_env ALERT_SMTP_USER %q\n' "$ALERT_SMTP_USER"
            printf 'upsert_env ALERT_SMTP_PASSWORD %q\n' "$ALERT_SMTP_PASSWORD"
            printf 'upsert_env ALERT_SMTP_SECURE %q\n' "$ALERT_SMTP_SECURE"
            printf 'upsert_env ALERTS_DEFERRED %q\n' "$ALERTS_DEFERRED"
            printf 'upsert_env BACKUP_STORAGE_MODE %q\n' "$backup_storage_mode"
            printf 'upsert_env OSS_BUCKET %q\n' "$OSS_BUCKET"
            printf 'upsert_env OSS_ENDPOINT %q\n' "$OSS_ENDPOINT"
            printf 'upsert_env OSS_ECS_ROLE_NAME %q\n' "$OSS_ECS_ROLE_NAME"
            printf 'upsert_env OSS_PREFIX %q\n' "${OSS_PREFIX:-miaomiao/production}"
            printf 'upsert_env LOCAL_BACKUP_RETENTION_DAYS %q\n' "${LOCAL_BACKUP_RETENTION_DAYS:-7}"
          } | ssh "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "bash -s -- $(printf '%q' "$PRODUCTION_PATH/.env.production")"

      - name: Pull and verify immutable release images
        timeout-minutes: 15
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PATH: ${{ vars.PRODUCTION_PATH }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_ACTOR: ${{ github.actor }}
          APP_IMAGE: ${{ steps.release.outputs.app_image }}
          APP_DIGEST: ${{ steps.release.outputs.app_digest }}
          APP_CONFIG_ID: ${{ steps.release.outputs.app_config_id }}
          WORKER_IMAGE: ${{ steps.release.outputs.worker_image }}
          WORKER_DIGEST: ${{ steps.release.outputs.worker_digest }}
          WORKER_CONFIG_ID: ${{ steps.release.outputs.worker_config_id }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
        run: |
          test -n "$GHCR_TOKEN"
          test -n "$GHCR_ACTOR"
          test -n "$PRODUCTION_PATH"
          [[ "$APP_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$WORKER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          remote_script="$(printf 'set -euo pipefail\nexport GIT_TERMINAL_PROMPT=0\ncd %q\ngit fetch --no-tags origin main\ngit cat-file -e %q^{commit}\ngit checkout --detach %q\nexec bash scripts/pull-release-images.sh %q %q %q %q %q %q %q %q\n' \
            "$PRODUCTION_PATH" "$RELEASE_COMMIT" "$RELEASE_COMMIT" \
            "$GHCR_ACTOR" "$APP_IMAGE" "$APP_DIGEST" "$WORKER_IMAGE" \
            "$WORKER_DIGEST" "$RELEASE_COMMIT" "$APP_CONFIG_ID" "$WORKER_CONFIG_ID")"
          # shellcheck disable=SC2029
          printf '%s' "$GHCR_TOKEN" | \
            ssh "$PRODUCTION_USER@$PRODUCTION_HOST" "$remote_script"

      - name: Deploy approved commit
        timeout-minutes: 10
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PATH: ${{ vars.PRODUCTION_PATH }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          remote_script="$(printf 'set -e\ncd %q\ngit fetch origin\ngit checkout --detach %q\nbash scripts/deploy-production.sh .env.production %q\n' \
            "$PRODUCTION_PATH" "$RELEASE_COMMIT" "$PRODUCTION_PATH")"
          printf '%s\n' "$remote_script" | ssh "$PRODUCTION_USER@$PRODUCTION_HOST" "bash -s"

      - name: Bootstrap production administrator
        if: inputs.bootstrap_admin
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PATH: ${{ vars.PRODUCTION_PATH }}
          ADMIN_KUAISHOU_IDS: ${{ secrets.ADMIN_KUAISHOU_IDS }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_NICKNAME: ${{ vars.ADMIN_NICKNAME }}
        run: |
          test -n "$ADMIN_KUAISHOU_IDS"
          test -n "$ADMIN_PASSWORD"
          test "${#ADMIN_PASSWORD}" -ge 8
          admin_script="$(printf 'set -e\ncd %q\nexport ADMIN_KUAISHOU_IDS=%q\nexport ADMIN_PASSWORD=%q\nexport ADMIN_NICKNAME=%q\ndocker compose --env-file .env.production run --rm --no-deps -e ADMIN_KUAISHOU_IDS -e ADMIN_PASSWORD -e ADMIN_NICKNAME worker npm run seed:admin\n' \
            "$PRODUCTION_PATH" "$ADMIN_KUAISHOU_IDS" "$ADMIN_PASSWORD" "${ADMIN_NICKNAME:-管理员}")"
          printf '%s\n' "$admin_script" | ssh "$PRODUCTION_USER@$PRODUCTION_HOST" "bash -s"

      - name: Start production ingress
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PATH: ${{ vars.PRODUCTION_PATH }}
        run: |
          # shellcheck disable=SC2029
          ssh "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "set -e; cd '$PRODUCTION_PATH'; docker compose --env-file .env.production --profile production up -d nginx; docker compose --env-file .env.production --profile production restart nginx; docker compose --env-file .env.production --profile production ps"

      - name: Verify production health
        env:
          PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          ALERTS_DEFERRED: ${{ inputs.confirm_alert_deferred }}
        run: |
          for _ in {1..12}; do
            if health_json="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 10 "https://$PRODUCTION_DOMAIN/api/health")"; then
              printf '%s\n' "$health_json"
              if jq -e --arg sha "$RELEASE_COMMIT" --arg deferred "$ALERTS_DEFERRED" \
                '.ok == true
                  and .app.commit == $sha
                  and .workerVersion.commit == $sha
                  and ($deferred != "true" or .weeklyChallenges.enabled == false)' \
                <<<"$health_json" >/dev/null; then
                exit 0
              fi
              echo "健康接口版本与请求发布 SHA 不一致，等待服务完成切换"
            fi
            sleep 10
          done
          exit 1

      - name: Retain the successfully deployed manifest and previous rollback manifest
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PATH: ${{ vars.PRODUCTION_PATH }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          # Metadata only: no secrets or production rows. Keep historical manifests indefinitely.
          record_path="releases/$RELEASE_COMMIT/deploy-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          remote_script="$(printf 'set -euo pipefail\ncd %q\numask 077\nmkdir -p %q\ncat > %q\nif test -f releases/current.json; then cp releases/current.json %q; fi\ncp %q releases/current.json\n' \
            "$PRODUCTION_PATH" "releases/$RELEASE_COMMIT" "$record_path" \
            "releases/$RELEASE_COMMIT/previous-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json" "$record_path")"
          ssh "$PRODUCTION_USER@$PRODUCTION_HOST" "$remote_script" < output/release/deploy-candidate.json

      - name: Preserve deployment candidate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployment-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/release/deploy-candidate.json
          if-no-files-found: ignore
          retention-days: 90
