name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      automatic:
        description: "由 main CI 自动交接；仍要求该 CI 完整成功且候选为最新 main"
        required: false
        default: false
        type: boolean
      release_commit:
        description: "main 完整 commit SHA；日常由 CI 自动填写，故障恢复可显式指定"
        required: true
        type: string
      candidate_run_id:
        description: "该 release SHA 在 main push 后成功生成候选镜像的 CI run ID"
        required: true
        type: string
      candidate_source:
        description: "ci-artifact 用原 CI 产物；server-archive 用已部署版本的签名留存副本"
        required: true
        default: ci-artifact
        type: choice
        options: [ci-artifact, server-archive]
      candidate_attempt:
        description: "自动交接及 server-archive 使用的原 CI attempt；手动 ci-artifact 从 API 核对"
        required: false
        default: "1"
        type: string
      migration_compatibility_note:
        description: "应用回滚时，说明已执行但旧版没有的迁移为何仍兼容；不得用于数据库回退"
        required: false
        default: ""
        type: string
      bootstrap_admin:
        description: "首次上线或明确重置管理员密码时勾选"
        required: true
        default: false
        type: boolean
      allow_deferred_alerts:
        description: "仅在告警稍后配置且周挑战保持关闭时勾选；部署会强制验证开关关闭"
        required: true
        default: false
        type: boolean
      recover_from_failed_release:
        description: "已评估的异常状态恢复：允许跳过切换前健康门禁（完整恢复会自动核验）"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.plan.outputs.eligible }}
      commit: ${{ steps.plan.outputs.commit }}
      run_id: ${{ steps.plan.outputs.run_id }}
      attempt: ${{ steps.plan.outputs.attempt }}
      automatic: ${{ steps.plan.outputs.automatic }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Resolve the exact successful main candidate
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_SOURCE: ${{ inputs.candidate_source }}
          CANDIDATE_ATTEMPT: ${{ inputs.candidate_attempt }}
          AUTOMATIC: ${{ inputs.automatic }}
        run: node scripts/automatic-release.mjs plan

  deploy:
    needs: plan
    if: needs.plan.outputs.eligible == 'true'
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: write
      packages: read
      actions: read
    outputs:
      commit: ${{ needs.plan.outputs.commit }}
      deployed: ${{ steps.record.outputs.deployed }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 65
    steps:
      - name: Validate release commit
        env:
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          if [[ ! "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_commit 必须是完整的 40 位 SHA"
            exit 1
          fi

      - name: Read the trusted controller from main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify release ancestry
        env:
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          git fetch --no-tags origin main
          git cat-file -e "$RELEASE_COMMIT^{commit}"
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main; then
            echo "release_commit 不是 origin/main 的祖先，拒绝部署未合并版本"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Skip an automatic candidate superseded while waiting for the deployment lock
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          AUTOMATIC: ${{ needs.plan.outputs.automatic }}
        run: node scripts/automatic-release.mjs fresh

      - name: Configure SSH
        if: steps.fresh.outputs.eligible == 'true'
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PATH: ${{ vars.PRODUCTION_PATH }}
        run: |
          test -n "$PRODUCTION_HOST"
          test -n "$PRODUCTION_USER"
          test -n "$PRODUCTION_PATH"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          timeout 20 ssh-keyscan -T 10 -H "$PRODUCTION_HOST" >> "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<'EOF'
          Host *
            ConnectTimeout 10
            ServerAliveInterval 15
            ServerAliveCountMax 3
            TCPKeepAlive yes
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Verify the exact successful main CI run
        id: candidate_run
        if: steps.fresh.outputs.eligible == 'true' && (inputs.candidate_source || 'ci-artifact') == 'ci-artifact'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          CANDIDATE_RUN_ID: ${{ needs.plan.outputs.run_id }}
        run: |
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          mkdir -p output/release
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > output/release/run.json
          node scripts/release-manifest.mjs verify-run output/release/run.json "$RELEASE_COMMIT" "$CANDIDATE_RUN_ID"

      - name: Download only that validated attempt's release manifest
        if: steps.fresh.outputs.eligible == 'true' && (inputs.candidate_source || 'ci-artifact') == 'ci-artifact'
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.plan.outputs.run_id }}
          name: release-candidate-${{ needs.plan.outputs.run_id }}-${{ steps.candidate_run.outputs.attempt }}
          path: output/release/candidate

      - name: Read the retained signed candidate (read-only)
        if: steps.fresh.outputs.eligible == 'true' && inputs.candidate_source == 'server-archive'
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PATH: ${{ vars.PRODUCTION_PATH }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          CANDIDATE_RUN_ID: ${{ needs.plan.outputs.run_id }}
          CANDIDATE_ATTEMPT: ${{ inputs.candidate_attempt }}
        run: |
          bash scripts/fetch-retained-release.sh "$RELEASE_COMMIT" "$CANDIDATE_RUN_ID" \
            "$CANDIDATE_ATTEMPT" output/release/candidate

      - name: Verify signed bytes and exact main CI identity
        if: steps.fresh.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          bash scripts/verify-signed-release.sh output/release/candidate/release-candidate.json \
            output/release/candidate/release-candidate.sigstore.json "$RELEASE_COMMIT" \
            > output/release/signature-verification.json

      - name: Validate the archived candidate's original successful CI attempt
        if: steps.fresh.outputs.eligible == 'true' && inputs.candidate_source == 'server-archive'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          CANDIDATE_RUN_ID: ${{ needs.plan.outputs.run_id }}
          CANDIDATE_ATTEMPT: ${{ inputs.candidate_attempt }}
        run: |
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ && "$CANDIDATE_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/attempts/$CANDIDATE_ATTEMPT" > output/release/run.json
          node scripts/release-manifest.mjs verify-run output/release/run.json "$RELEASE_COMMIT" "$CANDIDATE_RUN_ID"

      - name: Read the merged release schema and migrations
        if: steps.fresh.outputs.eligible == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.commit }}
          path: release-source
          persist-credentials: false

      - name: Validate manifest, image digests, and migration checksums
        if: steps.fresh.outputs.eligible == 'true'
        id: release
        env:
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          CANDIDATE_RUN_ID: ${{ needs.plan.outputs.run_id }}
        run: |
          node scripts/release-manifest.mjs verify output/release/candidate/release-candidate.json \
            output/release/run.json "$RELEASE_COMMIT" "$CANDIDATE_RUN_ID" release-source
          cp output/release/candidate/release-candidate.json output/release/deploy-candidate.json
          cp output/release/candidate/release-candidate.sigstore.json output/release/deploy-candidate.sigstore.json

      - name: Automatically recover release capacity from verified retired images
        if: steps.fresh.outputs.eligible == 'true'
        timeout-minutes: 13
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PATH: ${{ vars.PRODUCTION_PATH }}
          PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$PRODUCTION_PATH"
          test -n "$PRODUCTION_USER"
          payload="$(mktemp -d "$RUNNER_TEMP/miaomiao-retention.XXXXXX")"
          trap '[[ "$payload" == "$RUNNER_TEMP"/miaomiao-retention.* ]] && rm -rf -- "$payload"' EXIT
          cp scripts/production-image-retention.sh scripts/select-retired-images.jq scripts/image-retention-metadata.jq "$payload/"
          jq -n '{actor:env.GITHUB_ACTOR,token:env.GH_TOKEN}' > "$payload/registry.json"
          receiver='set -euo pipefail; umask 077; payload=$(mktemp -d /tmp/miaomiao-image-payload.XXXXXX); trap '\''[[ "$payload" == /tmp/miaomiao-image-payload.* ]] && rm -rf -- "$payload"'\'' EXIT; tar --no-same-owner --no-same-permissions -xzf - -C "$payload"; timeout --signal=TERM --kill-after=20s 10m bash "$payload/production-image-retention.sh" "$1" "$payload" "$2" clean'
          remote="$(printf 'bash -c %q -- %q %q' "$receiver" "$PRODUCTION_PATH" "$PRODUCTION_DOMAIN")"
          tar -C "$payload" -czf - . |
            timeout --signal=TERM --kill-after=30s 12m ssh "$PRODUCTION_USER@$PRODUCTION_HOST" "$remote" > output/release/image-retention.json
          jq -e '.healthy and .protectedResourcesPreserved and .capacityAtLeast6GiB' output/release/image-retention.json >/dev/null

      - name: Automatically rehearse changed migrations on an isolated sanitized copy
        if: steps.fresh.outputs.eligible == 'true'
        timeout-minutes: 15
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PATH: ${{ vars.PRODUCTION_PATH }}
          PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          set -euo pipefail
          umask 077
          payload="$(mktemp -d)"
          trap 'rm -rf -- "$payload"' EXIT
          test -z "$(find release-source/prisma -type l -print -quit)"
          cp -R release-source/prisma "$payload/prisma"
          find "$payload/prisma" -maxdepth 1 -type f ! -name schema.prisma -delete
          cp scripts/production-copy-rehearsal.sh scripts/sanitize-rehearsal.sql scripts/rehearsal-aggregate.sql scripts/rehearsal-structure.sql "$payload/"
          cp scripts/migration-history.jq scripts/legacy-migration-checksums.json "$payload/"
          receiver='set -euo pipefail; umask 077; payload=$(mktemp -d /tmp/miaomiao-copy-payload.XXXXXX); trap '\''[[ "$payload" == /tmp/miaomiao-copy-payload.* ]] && rm -rf -- "$payload"'\'' EXIT; tar --no-same-owner --no-same-permissions -xzf - -C "$payload"; timeout --signal=TERM --kill-after=20s 12m bash "$payload/production-copy-rehearsal.sh" "$1" "$payload" "$2" "$3" "$4" if-changed'
          remote="$(printf 'bash -c %q -- %q %q %q %q' "$receiver" "$PRODUCTION_PATH" "$PRODUCTION_DOMAIN" "$RELEASE_COMMIT" "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")"
          tar -czf - -C "$payload" . |
            timeout --signal=TERM --kill-after=30s 14m ssh "$PRODUCTION_USER@$PRODUCTION_HOST" "$remote" > output/release/copy-rehearsal.json
          jq -e --arg sha "$RELEASE_COMMIT" '.qualified and .candidateCommit==$sha and .rawDataExported==false' output/release/copy-rehearsal.json >/dev/null

      - name: Allocate or reuse an immutable release version
        if: steps.fresh.outputs.eligible == 'true'
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: node scripts/automatic-release.mjs version

      - name: Run the entire release under one host lock
        if: steps.fresh.outputs.eligible == 'true'
        timeout-minutes: 33
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PATH: ${{ vars.PRODUCTION_PATH }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_SMTP_HOST: ${{ vars.ALERT_SMTP_HOST }}
          ALERT_SMTP_PORT: ${{ vars.ALERT_SMTP_PORT }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
          ALERT_SMTP_SECURE: ${{ vars.ALERT_SMTP_SECURE }}
          ALERTS_DEFERRED: ${{ vars.ALERTS_DEFERRED || inputs.allow_deferred_alerts || 'false' }}
          BACKUP_STORAGE_MODE: ${{ vars.BACKUP_STORAGE_MODE }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
          OSS_ECS_ROLE_NAME: ${{ vars.OSS_ECS_ROLE_NAME }}
          OSS_PREFIX: ${{ vars.OSS_PREFIX }}
          LOCAL_BACKUP_RETENTION_DAYS: ${{ vars.LOCAL_BACKUP_RETENTION_DAYS }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          BOOTSTRAP_ADMIN: ${{ inputs.bootstrap_admin }}
          RECOVER_FROM_FAILED_RELEASE: ${{ inputs.recover_from_failed_release }}
          MIGRATION_COMPATIBILITY_NOTE: ${{ inputs.migration_compatibility_note }}
          PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
          ADMIN_KUAISHOU_IDS: ${{ secrets.ADMIN_KUAISHOU_IDS }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_NICKNAME: ${{ vars.ADMIN_NICKNAME }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(mktemp -d)"
          trap 'rm -rf -- "$payload"' EXIT
          node scripts/prepare-production-release.mjs "$payload"
          receiver="$(cat scripts/receive-production-release.sh)"
          remote="$(printf 'bash -c %q -- %q' "$receiver" "$PRODUCTION_PATH")"
          # The token and optional administrator password are files in this
          # private stdin stream. No secret is interpolated into the SSH command.
          tar -czf - -C "$payload" request.json manifest.json attestation.json production-lock.sh production-release.sh \
            production-preflight.sh pull-release-images.sh backup-db.sh verify-release-health.sh \
            release-lifecycle.sh nginx-release.conf verify-web-candidate.mjs legacy-queue-drain.cjs release-capacity.sh \
            migration-history.jq legacy-migration-checksums.json \
            | timeout --signal=TERM --kill-after=30s 32m ssh "$PRODUCTION_USER@$PRODUCTION_HOST" "$remote"

      - name: Collect the atomic release journal even after failure
        if: always() && steps.fresh.outputs.eligible == 'true'
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PATH: ${{ vars.PRODUCTION_PATH }}
        run: |
          if test -f "$HOME/.ssh/config"; then
            mkdir -p output/release
            path="$PRODUCTION_PATH/releases/attempts/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/journal.json"
            remote="$(printf 'cat -- %q' "$path")"
            timeout 30 ssh "$PRODUCTION_USER@$PRODUCTION_HOST" "$remote" > output/release/deploy-journal.json || true
          fi

      - name: Record the deployed release automatically
        if: steps.fresh.outputs.eligible == 'true'
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: node scripts/automatic-release.mjs record

      - name: Preserve release evidence (never the private payload)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-release-${{ needs.plan.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/release/*.json
          if-no-files-found: warn
          retention-days: 90

  observe:
    needs: [plan, deploy]
    if: needs.deploy.outputs.deployed == 'true'
    # Observation never owns the production deployment concurrency group.
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: production-release-${{ needs.plan.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/release
      - name: Configure bounded observation SSH
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          test -n "$PRODUCTION_HOST"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          timeout 20 ssh-keyscan -T 10 -H "$PRODUCTION_HOST" >> "$HOME/.ssh/known_hosts"
          printf '%s\n' 'Host *' '  BatchMode yes' '  ConnectTimeout 10' '  ServerAliveInterval 15' '  ServerAliveCountMax 3' > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
      - name: Observe thirty healthy minutes and reconcile before and after
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PATH: ${{ vars.PRODUCTION_PATH }}
          PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
        run: node scripts/observe-production-release.mjs
      - name: Retain sanitized observation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-observation-${{ needs.plan.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/release/observation.json
            output/release/release-record.json
          if-no-files-found: warn
          retention-days: 90

  finalize:
    needs: [plan, deploy, observe]
    if: always() && needs.deploy.outputs.deployed == 'true' && (needs.observe.result == 'success' || needs.observe.result == 'failure')
    # Only the brief metadata update shares the deploy lock. This closes the
    # GET/PATCH race with a same-version redeployment's new release record.
    concurrency:
      group: production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: production-observation-${{ needs.plan.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/release
      - name: Finalize only this deployment's observation record
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automatic-release.mjs observe-record
      - uses: actions/upload-artifact@v7
        with:
          name: production-final-record-${{ needs.plan.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/release/release-record.json
          if-no-files-found: error
          retention-days: 90
