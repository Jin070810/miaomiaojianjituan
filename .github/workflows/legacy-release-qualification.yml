name: Original v1.11 Image Qualification

on:
  pull_request:
    paths:
      - .github/workflows/legacy-release-qualification.yml
      - scripts/qualify-legacy-images.sh
      - scripts/test-legacy-pending-request.mjs
      - scripts/legacy-queue-drain.cjs
      - scripts/release-lifecycle.sh
      - scripts/pull-release-images.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: qualify (containerd=${{ matrix.containerd }})
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        containerd: [false, true]
    permissions:
      contents: read
      packages: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: docker/setup-docker-action@v5
        with:
          version: v29.6.2
          set-host: true
          daemon-config: |
            {"features":{"containerd-snapshotter":${{ matrix.containerd }}}}
      - name: Verify the original deployment identity from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output/legacy-qualification
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/36514915183" | jq -e '
            select(.head_sha=="752b084ec220ce5c827609611e51ce718b28b92d" and .path==".github/workflows/deploy-production.yml"
              and .head_branch=="main" and .status=="completed" and .conclusion=="success")
            | {id,head_sha,head_branch,path,status,conclusion,run_attempt}' > output/legacy-qualification/original-deployment.json
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify original manifest and config identity across storage backends
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | PULL_RELEASE_NO_TAG=1 bash scripts/pull-release-images.sh "$GITHUB_ACTOR" \
            ghcr.io/jin070810/miaomiaojianjituan-app sha256:609d72450c2dfec9105302b2368979cac4853c9ab7c55b8af69021307385eca6 \
            ghcr.io/jin070810/miaomiaojianjituan-worker sha256:21ae3d56522cf9cd02e249b9804c747b2288195b4bd66bcc2b63a8a9c8ceda71 \
            752b084ec220ce5c827609611e51ce718b28b92d \
            sha256:0a855c5ad4c208ae2ded28983c21b98ede77b28015aeaa9a9de744883933f87b \
            sha256:2dd09b43cd5c1f36fde69abd59c955087ab1080af3beeb15df7699cce6092e0b
          docker info --format '{{json .DriverStatus}}' > output/legacy-qualification/docker-driver.json
      - name: Qualify original images by draining paused queues before TERM
        run: bash scripts/qualify-legacy-images.sh
      - name: Preserve only synthetic qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: original-v111-qualification-${{ github.run_id }}-${{ github.run_attempt }}-containerd-${{ matrix.containerd }}
          path: output/legacy-qualification/*.json
          if-no-files-found: error
          retention-days: 90
