name: Reconcile Redemption Orders

on:
  workflow_dispatch:
    inputs:
      action:
        description: "dry-run 只读预览；apply 执行事务"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      release_commit:
        description: "已部署并合并到 main 的完整 commit SHA"
        required: true
        type: string
      cutoff:
        description: "订单范围截止时间（ISO 8601），dry-run 与 apply 必须使用同一个值"
        required: true
        type: string
      excluded_gift_name:
        description: "需要取消并退款的礼品名称"
        required: true
        default: "悠哈奶糖条"
        type: string
      reason:
        description: "维护原因"
        required: true
        default: "订单资料同步：已发放订单统一结算"
        type: string
      confirm_apply:
        description: "我已核对 dry-run 输出，确认执行取消退款和批量发放"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-redemption-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require apply confirmation
        if: inputs.action == 'apply'
        env:
          CONFIRM_APPLY: ${{ inputs.confirm_apply }}
        run: test "$CONFIRM_APPLY" = "true"

      - name: Validate release commit
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          if [[ ! "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_commit 必须是完整的 40 位 SHA"
            exit 1
          fi

      - name: Verify commit is deployed ancestry
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify release ancestry
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          git fetch --no-tags origin main
          git cat-file -e "$RELEASE_COMMIT^{commit}"
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main

      - name: Configure SSH
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PATH: ${{ vars.PRODUCTION_PATH }}
        run: |
          test -n "$PRODUCTION_HOST"
          test -n "$PRODUCTION_USER"
          test -n "$PRODUCTION_PATH"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H "$PRODUCTION_HOST" >> "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<'EOF'
          Host *
            ServerAliveInterval 30
            ServerAliveCountMax 20
            TCPKeepAlive yes
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Run reconciliation
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PATH: ${{ vars.PRODUCTION_PATH }}
          ADMIN_KUAISHOU_IDS: ${{ secrets.ADMIN_KUAISHOU_IDS }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          ACTION: ${{ inputs.action }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          CUTOFF: ${{ inputs.cutoff }}
          EXCLUDED_GIFT_NAME: ${{ inputs.excluded_gift_name }}
          REASON: ${{ inputs.reason }}
        run: |
          [[ "$RUN_ID" =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]]
          remote_script="$(cat <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd "$1"
          commit="$2"
          run_id="$3"
          export ADMIN_KUAISHOU_IDS="$4"
          action="$5"
          cutoff="$6"
          gift="$7"
          reason="$8"
          umask 077
          exec 9>.production.lock
          flock --exclusive --wait 120 9
          test "$(timeout 15 git rev-parse HEAD)" = "$commit"
          worker_container="$(timeout 15 docker ps --filter label=com.docker.compose.project=miaomiao-points --filter label=com.docker.compose.service=worker --format '{{.ID}}')"
          [[ -n "$worker_container" && "$worker_container" != *$'\n'* ]]
          worker_image="$(timeout 15 docker inspect --format '{{.Image}}' "$worker_container")"
          test "$(timeout 15 docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$worker_image")" = "$commit"
          override="$(mktemp)"
          container="miaomiao-reconciliation-$run_id"
          cleanup() {
            timeout --kill-after=5s 15s docker rm -f "$container" >/dev/null 2>&1 || true
            rm -f -- "$override"
          }
          trap cleanup EXIT
          trap 'exit 143' TERM HUP
          jq -n --arg image "$worker_image" '{services:{worker:{image:$image}}}' > "$override"
          timeout --signal=TERM --kill-after=20s 10m docker compose --env-file .env.production \
            -f docker-compose.yml -f "$override" run --rm --no-deps --pull never -T --name "$container" \
            -e ADMIN_KUAISHOU_IDS worker ./node_modules/.bin/tsx scripts/reconcile-redemption-orders.ts \
            --action "$action" --cutoff "$cutoff" --excluded-gift-name "$gift" --reason "$reason"
          REMOTE_SCRIPT
          )"
          # Arguments, including credentials, travel as escaped stdin assignments.
          {
            printf 'set -- %q %q %q %q %q %q %q %q\n' "$PRODUCTION_PATH" "$RELEASE_COMMIT" "$RUN_ID" \
              "$ADMIN_KUAISHOU_IDS" "$ACTION" "$CUTOFF" "$EXCLUDED_GIFT_NAME" "$REASON"
            printf '%s\n' "$remote_script"
          } | ssh -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "$PRODUCTION_USER@$PRODUCTION_HOST" "timeout --signal=TERM --kill-after=30s 13m bash -s"
