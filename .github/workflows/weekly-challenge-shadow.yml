name: Weekly Challenge DeepSeek Shadow

on:
  workflow_dispatch:
    inputs:
      confirm_paid_shadow:
        description: "确认使用真实 DeepSeek 运行 300 人、两个周期的付费影子验证"
        required: true
        default: false
        type: boolean
      use_self_hosted:
        description: "仅在 GitHub-hosted runner 不可用时使用已授权的一次性自托管 runner"
        required: true
        default: false
        type: boolean
      release_commit:
        description: "自托管验收要 checkout 的已审查发布 commit SHA"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: weekly-challenge-deepseek-shadow
  cancel-in-progress: false

jobs:
  shadow:
    if: github.ref == 'refs/heads/main' && inputs.confirm_paid_shadow && !inputs.use_self_hosted
    runs-on: ubuntu-latest
    environment: production
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: miaomiao_shadow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d miaomiao_shadow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/miaomiao_shadow?schema=shadow_v13_rc
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
      DEEPSEEK_TIMEOUT_MS: "75000"
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
      ALERT_SMTP_HOST: ${{ vars.ALERT_SMTP_HOST }}
      ALERT_SMTP_PORT: ${{ vars.ALERT_SMTP_PORT }}
      ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
      ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
      ALERT_SMTP_SECURE: ${{ vars.ALERT_SMTP_SECURE }}
      WEEKLY_CHALLENGE_SHADOW_CONFIRM: I_UNDERSTAND_PAID_DEEPSEEK_SHADOW
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - name: Run paid DeepSeek shadow
        timeout-minutes: 60
        run: |
          set -o pipefail
          mkdir -p output/weekly-shadow
          npm --silent run weekly:shadow | tee output/weekly-shadow/report.json
      - name: Upload shadow report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-challenge-deepseek-shadow
          path: output/weekly-shadow/report.json
          if-no-files-found: error
          retention-days: 30

  shadow-self-hosted:
    if: inputs.confirm_paid_shadow && inputs.use_self_hosted && inputs.release_commit != ''
    runs-on: [self-hosted, Windows, X64, weekly-shadow]
    timeout-minutes: 60
    environment: production
    env:
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
      DEEPSEEK_TIMEOUT_MS: "75000"
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
      ALERT_SMTP_HOST: ${{ vars.ALERT_SMTP_HOST }}
      ALERT_SMTP_PORT: ${{ vars.ALERT_SMTP_PORT }}
      ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
      ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
      ALERT_SMTP_SECURE: ${{ vars.ALERT_SMTP_SECURE }}
      WEEKLY_CHALLENGE_SHADOW_CONFIRM: I_UNDERSTAND_PAID_DEEPSEEK_SHADOW
    steps:
      - name: Validate release commit
        shell: pwsh
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          if ($env:RELEASE_COMMIT -notmatch '^[0-9a-f]{40}$') {
            throw 'release_commit 必须是完整的 40 位 SHA'
          }
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_commit }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Start isolated PostgreSQL
        shell: pwsh
        run: |
          $container = "miaomiao-shadow-$env:GITHUB_RUN_ID"
          $schema = "shadow_v13_selfhosted_$env:GITHUB_RUN_ID"
          "SHADOW_CONTAINER=$container" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:55432/miaomiao_shadow?schema=$schema" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          docker run --detach --rm --name $container `
            --env POSTGRES_DB=miaomiao_shadow `
            --env POSTGRES_USER=postgres `
            --env POSTGRES_PASSWORD=postgres `
            --publish 127.0.0.1:55432:5432 `
            postgres:16-alpine
          for ($attempt = 1; $attempt -le 30; $attempt += 1) {
            docker exec $container pg_isready -U postgres -d miaomiao_shadow
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 2
          }
          throw '临时 PostgreSQL 未在 60 秒内就绪'
      - run: npm ci
      - run: npx prisma migrate deploy
      - name: Run paid DeepSeek shadow
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force output/weekly-shadow | Out-Null
          npm --silent run weekly:shadow | Tee-Object -FilePath output/weekly-shadow/report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload shadow report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-challenge-deepseek-shadow-self-hosted-${{ github.run_id }}
          path: output/weekly-shadow/report.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove isolated PostgreSQL
        if: always()
        shell: pwsh
        run: |
          if ($env:SHADOW_CONTAINER) {
            docker rm --force $env:SHADOW_CONTAINER
          }
