events {}

http {
  server_tokens off;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  upstream miaomiao_app { server app:3000; }

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }
  server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    # No WebSocket endpoint exists; strip hop-by-hop upgrade requests.
    proxy_set_header Upgrade "";
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Only this read-only route remains reachable while the gate is closed.
    # Legacy GET handlers may write; all other public routes are gated too.
    location = /api/health {
      if ($request_method !~ ^(GET|HEAD)$) { return 405; }
      proxy_pass http://miaomiao_app;
    }
    location /api/ {
      error_page 503 = @release_api_maintenance;
      if (-f /etc/nginx/release/maintenance) { return 503; }
      proxy_pass http://miaomiao_app;
    }
    location / {
      error_page 503 = @release_page_maintenance;
      if (-f /etc/nginx/release/maintenance) { return 503; }
      proxy_pass http://miaomiao_app;
    }
    location @release_api_maintenance {
      default_type application/json;
      add_header Retry-After "30" always;
      add_header Cache-Control "no-store" always;
      add_header X-Miaomiao-Maintenance "1" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Content-Type-Options "nosniff" always;
      return 503 '{"error":"系统正在更新，请稍后重试","maintenance":true}';
    }
    location @release_page_maintenance {
      default_type text/html;
      charset utf-8;
      add_header Retry-After "30" always;
      add_header Cache-Control "no-store" always;
      add_header X-Miaomiao-Maintenance "1" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      return 503 '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>系统更新中 · 妙妙剪辑团</title><body style="margin:0;background:#fbf6ed;color:#302647;font:18px/1.7 system-ui"><main style="max-width:34rem;margin:15vh auto;padding:28px"><h1 style="font-size:28px">系统正在更新</h1><p>请稍后刷新页面。尚未确认成功的操作，可以在恢复后查看记录再重试。</p><button onclick="location.reload()" style="min-height:44px;padding:8px 24px;background:#5034b5;color:white;border:0;border-radius:8px;font:inherit">刷新页面</button></main></body></html>';
    }
  }
}
